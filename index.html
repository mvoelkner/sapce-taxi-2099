<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Space Taxi 2099 - Based on C64 Classic</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#40318d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Space Taxi">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background: #40318d;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
    font-family: 'Press Start 2P', monospace;
    overflow: hidden;
  }

  #game-wrapper {
    border: 4px solid #7869c4;
    border-radius: 4px;
    box-shadow: 0 0 30px rgba(120, 105, 196, 0.5);
    position: relative;
  }

  canvas {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  #instructions {
    color: #7869c4;
    font-size: 9px;
    margin-top: 10px;
    text-align: center;
    line-height: 1.8;
  }

  /* ── Touch-Modus: randlos, Vollbild ───────────────────────── */

  .is-touch body { background: #000; }

  .is-touch #game-wrapper {
    border: none;
    border-radius: 0;
    box-shadow: none;
  }

  .is-touch #instructions { display: none; }

  /* ── Touch-Steuerung ──────────────────────────────────────── */

  .touch-controls {
    display: none;
  }

  .is-touch .touch-controls {
    display: block;
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
  }

  .touch-controls__cluster {
    position: absolute;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
    display: flex;
    gap: 14px;
  }

  .touch-controls__cluster--left {
    left: calc(env(safe-area-inset-left, 0px) + 14px);
  }

  .touch-controls__cluster--right {
    right: calc(env(safe-area-inset-right, 0px) + 14px);
  }

  .touch-controls__btn {
    width: 68px;
    height: 68px;
    border: 2px solid #7cc6fe;
    border-radius: 10px;
    background: rgba(53, 40, 121, 0.55);
    color: #7cc6fe;
    font-family: system-ui, -apple-system, sans-serif;
    font-size: 26px;
    line-height: 1;
    opacity: 0.45;
    pointer-events: auto;
    touch-action: none;
    transition: opacity 80ms linear, transform 80ms linear;
  }

  .touch-controls__btn--active {
    opacity: 0.9;
    background: rgba(120, 105, 196, 0.8);
    transform: scale(0.94);
  }

  /* ── Vollbild-Umschalter ──────────────────────────────────── */

  .fullscreen-btn {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 10px);
    right: calc(env(safe-area-inset-right, 0px) + 10px);
    width: 44px;
    height: 44px;
    border: 2px solid #7869c4;
    border-radius: 8px;
    background: rgba(53, 40, 121, 0.55);
    color: #7cc6fe;
    font-family: system-ui, -apple-system, sans-serif;
    font-size: 18px;
    opacity: 0.4;
    pointer-events: auto;
    touch-action: manipulation;
    z-index: 11;
  }

  /* ── Hochformat-Sperre ────────────────────────────────────── */

  .rotate-gate {
    display: none;
  }

  @media (orientation: portrait) {
    .is-touch .rotate-gate {
      display: flex;
      position: fixed;
      inset: 0;
      z-index: 20;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      background: #000;
      text-align: center;
      padding: 24px;
    }

    .is-touch #game-wrapper,
    .is-touch .touch-controls,
    .is-touch .fullscreen-btn { visibility: hidden; }
  }

  .rotate-gate__icon {
    font-family: system-ui, -apple-system, sans-serif;
    font-size: 56px;
    animation: rotate-gate-tilt 1.8s ease-in-out infinite;
  }

  .rotate-gate__text {
    color: #7cc6fe;
    font-size: 11px;
    line-height: 2;
  }

  @keyframes rotate-gate-tilt {
    0%, 45%   { transform: rotate(0deg); }
    70%, 100% { transform: rotate(-90deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    .rotate-gate__icon { animation: none; }
    .touch-controls__btn { transition: none; }
  }

  /* ── Explosion ────────────────────────────────────────────── */
  /* A sprite strip, so it is a DOM layer over the canvas rather than a canvas
     draw. JS puts its centre on the taxi, hence the negative margin: the left
     and top it sets are the centre point, not the corner.
     explosion3.png is 1252x126 and holds ten equal frames of 125.2px. Scaling
     the strip to 1300px makes each frame exactly the 130px of the box, so no
     sliver of the neighbouring frame bleeds in. */

  .explosion {
    position: absolute;
    z-index: 100;
    display: none;
    width: 130px;
    height: 130px;
    margin: -65px 0 0 -65px;
    background-image: url(explosion3.png);
    background-repeat: no-repeat;
    background-size: 1300px auto;
    background-position: 1000px 1000px;
    pointer-events: none;
  }

  .explosion--active {
    display: block;
    animation: explosion 0.8s steps(11, jump-none) 1;
  }

  @keyframes explosion {
    from { background-position: 0 0; }
    to   { background-position: -1300px 0; }
  }
</style>
</head>
<body>

<div id="game-wrapper">
  <canvas id="game" width="800" height="500"></canvas>
  <div class="explosion" id="explosion"></div>
</div>
<div id="instructions">
  ARROW KEYS: THRUST &amp; STEER &nbsp;|&nbsp; SPACE: START/CONTINUE<br>
  LAND <em>BESIDE</em> THE PASSENGER &mdash; GEAR MUST BE FULLY DOWN<br>
  NEVER REFUEL WHILE CARRYING A FARE
</div>

<div class="touch-controls" id="touch-controls">
  <div class="touch-controls__cluster touch-controls__cluster--left">
    <button type="button" class="touch-controls__btn touch-controls__btn--left"  data-input="left"  aria-label="Steer left">&#9664;</button>
    <button type="button" class="touch-controls__btn touch-controls__btn--right" data-input="right" aria-label="Steer right">&#9654;</button>
  </div>
  <div class="touch-controls__cluster touch-controls__cluster--right">
    <button type="button" class="touch-controls__btn touch-controls__btn--thrust" data-input="up" aria-label="Thrust">&#9650;</button>
  </div>
</div>

<button type="button" class="fullscreen-btn" id="fullscreen-btn" aria-label="Toggle fullscreen" hidden>&#9974;</button>

<div class="rotate-gate">
  <div class="rotate-gate__icon">&#128241;</div>
  <p class="rotate-gate__text">PLEASE ROTATE<br>YOUR DEVICE</p>
</div>

<audio id="explosion-sound" src="explosion.mp3" preload="auto"></audio>

<script>
// ============================================================
//  SPACE TAXI — Web Remake of the 1984 Commodore 64 Classic
// ============================================================
(() => {
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const explosionEl = document.getElementById("explosion");
const explosionSound = document.getElementById("explosion-sound");

// CSS pixels per world unit. Only DOM overlays need it; the canvas itself is
// scaled by the ctx transform. layoutCanvas keeps it current.
let viewScale = 1;

// World coordinates are FIXED. The canvas backing store is resized to the
// device's real pixel resolution, but every level coordinate, HUD position and
// physics constant keeps addressing this 800x500 space via the ctx transform.
// The visible viewport. Fixed, and identical to one sector.
const VIEW_W = 800;
const VIEW_H = 500;
const SECTOR_W = VIEW_W;
const SECTOR_H = VIEW_H;

// The playfield of the running level, derived from its sector grid. A one-sector
// level is exactly the viewport, which is why the camera never moves there.
let worldW = SECTOR_W;
let worldH = SECTOR_H;

const isTouchDevice = window.matchMedia("(pointer: coarse)").matches;
document.documentElement.classList.toggle("is-touch", isTouchDevice);

// ── Retro C64-ish palette ───────────────────────────────────
const C = {
  black:      "#000000",
  white:      "#ffffff",
  red:        "#68372b",
  cyan:       "#70a4b2",
  purple:     "#6f3d86",
  green:      "#588d43",
  blue:       "#352879",
  yellow:     "#b8c76f",
  orange:     "#6f4f25",
  brown:      "#433900",
  lightRed:   "#9a6759",
  darkGrey:   "#444444",
  grey:       "#6c6c6c",
  lightGreen: "#9ad284",
  lightBlue:  "#6c5eb5",
  lightGrey:  "#959595",
  skyBlue:    "#7cc6fe",
  hotYellow:  "#ffff55",
  hotOrange:  "#ff8844",
  padGreen:   "#55ff55",
};

// ── Audio (simple beep synth) ───────────────────────────────
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function beep(freq, dur, type = "square", vol = 0.08) {
  try {
    ensureAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.value = vol;
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + dur);
  } catch(e) {}
}
function sndPickup()  { beep(880,.1); setTimeout(()=>beep(1100,.1),100); setTimeout(()=>beep(1320,.15),200); }
function sndDropoff() { beep(1320,.1); setTimeout(()=>beep(1100,.1),80); setTimeout(()=>beep(880,.1),160); setTimeout(()=>beep(1320,.2),260); }
function sndCrash()   { for(let i=0;i<6;i++) setTimeout(()=>beep(200-i*25,.12,"sawtooth",0.12),i*60); }
function sndLevelUp() { [0,100,200,300,400].forEach((d,i)=>setTimeout(()=>beep(440+i*110,.15,"triangle",0.1),d)); }

// Sad trombone: three descending notes, then one that sags away
function sndSad() {
  [[392,0.18],[349,0.18],[294,0.22]].forEach(([f,d],i) =>
    setTimeout(() => beep(f, d, "triangle", 0.09), i * 170));
  setTimeout(() => {
    try {
      ensureAudio();
      const t = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(262, t);
      osc.frequency.exponentialRampToValueAtTime(150, t + 0.7);   // the droop
      gain.gain.setValueAtTime(0.1, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.75);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(); osc.stop(t + 0.75);
    } catch (e) {}
  }, 510);
}
function sndFuelWarn() {
  beep(300,.1,"square",0.06);
  setTimeout(()=>beep(300,.1,"square",0.06),200);
  haptic(HAPTICS.fuelWarn);
}

// ── Rocket engine (continuous filtered noise) ───────────────
// One looping noise source split into a low rumble and a high hiss; thrust
// fades their gains in and out. Replaces the old re-triggered sawtooth blip,
// which read as a click train rather than an engine.
let engine = null;
let engineState = { low: -1, hi: -1, cut: -1 };

function ensureEngine() {
  if (engine || !audioCtx) return;
  try {
    const len = Math.floor(audioCtx.sampleRate * 2);
    const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;

    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    src.loop = true;

    const low = audioCtx.createBiquadFilter();
    low.type = "lowpass"; low.frequency.value = 200; low.Q.value = 3;
    const hi = audioCtx.createBiquadFilter();
    hi.type = "highpass"; hi.frequency.value = 2400;

    const lowGain = audioCtx.createGain(); lowGain.gain.value = 0;
    const hiGain  = audioCtx.createGain(); hiGain.gain.value  = 0;

    src.connect(low).connect(lowGain).connect(audioCtx.destination);
    src.connect(hi).connect(hiGain).connect(audioCtx.destination);
    src.start();
    engine = { src, low, lowGain, hiGain };
  } catch (e) { engine = null; }
}

// main = upward thrust, side = lateral thruster. Side jets are quieter and
// brighter so the two are distinguishable by ear.
function setThrustSound(main, side) {
  if (!audioCtx) return;          // wait for the first gesture
  ensureEngine();
  if (!engine) return;
  const lowTarget = main ? 0.20 : (side ? 0.06 : 0);
  const hiTarget  = main ? 0.05 : (side ? 0.04 : 0);
  const cutTarget = main ? 200  : 340;
  if (lowTarget === engineState.low && hiTarget === engineState.hi && cutTarget === engineState.cut) return;
  engineState = { low: lowTarget, hi: hiTarget, cut: cutTarget };
  try {
    const t = audioCtx.currentTime;
    engine.lowGain.gain.setTargetAtTime(lowTarget, t, 0.04);
    engine.hiGain.gain.setTargetAtTime(hiTarget, t, 0.04);
    engine.low.frequency.setTargetAtTime(cutTarget, t, 0.06);
  } catch (e) {}
}

// ── "HEY TAXI!" sample ──────────────────────────────────────
// A recorded sample replaces the former speechSynthesis call. Three reasons:
// it plays through the AudioContext that is already unlocked, so iOS - where
// speechSynthesis needs the first utterance to come from a user gesture and the
// game only ever calls this from a timer - works like everything else; it can be
// filtered and distorted, which speechSynthesis never could; and it sounds the
// same on every device instead of depending on the installed system voice.
//
// Embedded as base64 rather than fetched: 3.4 KB is nothing, it keeps the game a
// single file, and fetch() would fail under file:// on CORS grounds.

let heyTaxiBuffer = null;
let heyTaxiVoice  = null;      // currently playing source, so shouts don't stack
let heyTaxiState  = "idle";    // idle | loading | ready | failed

function loadHeyTaxiSample() {
  if (heyTaxiState !== "idle" || !audioCtx) return;
  heyTaxiState = "loading";
  try {
    const bin = atob(HEY_TAXI_MP3_B64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    // Callback form: the promise form is missing on older Safari
    audioCtx.decodeAudioData(
      bytes.buffer,
      buf => { heyTaxiBuffer = buf; heyTaxiState = "ready"; },
      ()  => { heyTaxiState = "failed"; }
    );
  } catch (e) {
    heyTaxiState = "failed";
  }
}

function playHeyTaxiSample() {
  if (heyTaxiState !== "ready" || !heyTaxiBuffer || !audioCtx) return false;
  try {
    // Cut off a shout still running, rather than layering two on top of another
    if (heyTaxiVoice) { try { heyTaxiVoice.stop(); } catch (e) {} }
    const src  = audioCtx.createBufferSource();
    const gain = audioCtx.createGain();
    src.buffer = heyTaxiBuffer;
    gain.gain.value = 0.9;
    src.connect(gain).connect(audioCtx.destination);
    src.onended = () => { if (heyTaxiVoice === src) heyTaxiVoice = null; };
    src.start();
    heyTaxiVoice = src;
    return true;
  } catch (e) {
    return false;
  }
}

// Used while the sample is still decoding, and if decoding ever fails
function heyTaxiBeeps() { beep(600,.08); setTimeout(()=>beep(800,.12),100); }

function sndHeyTaxi() {
  ensureAudio();
  loadHeyTaxiSample();
  if (!playHeyTaxiSample()) heyTaxiBeeps();
  haptic(HAPTICS.shout);
}

// ── Explosion sample ────────────────────────────────────────
// A plain <audio> element, unlike "HEY TAXI!" which is embedded base64 and goes
// through the AudioContext. 40 KB would be 53 KB of base64 in this file, and a
// media element loads happily under file:// where fetch() trips over CORS. The
// price is iOS: an audio element needs its own gesture-initiated play() before
// it will ever sound, and a crash is not a gesture. primeExplosionSound() pays
// that price on the first touch, muted, so the real one is not the first.
let explosionPrimed = false;

function primeExplosionSound() {
  if (explosionPrimed || !explosionSound) return;
  explosionPrimed = true;
  try {
    explosionSound.muted = true;
    const p = explosionSound.play();
    const settle = () => {
      try {
        explosionSound.pause();
        explosionSound.currentTime = 0;
        explosionSound.muted = false;
      } catch (e) {}
    };
    if (p && p.then) p.then(settle, settle); else settle();
  } catch (e) {
    try { explosionSound.muted = false; } catch (e2) {}
  }
}

function sndExplosion() {
  if (!explosionSound) return false;
  try {
    explosionSound.muted = false;
    explosionSound.currentTime = 0;
    const p = explosionSound.play();
    if (p && p.catch) p.catch(() => {});
    return true;
  } catch (e) {
    return false;
  }
}

// ── Platform (audio unlock, fullscreen, haptics) ────────────
function unlockAudio() {
  try {
    ensureAudio();
    if (audioCtx.state === "suspended") audioCtx.resume();
    // Decode here, in a real gesture, so the first shout is never a beep
    loadHeyTaxiSample();
    primeExplosionSound();
  } catch (e) {}
}
function setAudioSuspended(suspend) {
  if (!audioCtx) return;
  try { suspend ? audioCtx.suspend() : audioCtx.resume(); } catch (e) {}
}
// ── Haptics ─────────────────────────────────────────────────
// Two backends behind one set of named events. The web has navigator.vibrate,
// which takes millisecond patterns — and which iOS Safari does not implement at
// all, so on an iPhone the browser build is simply silent. Wrapped by Capacitor
// the Taptic Engine is reachable instead, but it speaks in kinds of tap rather
// than durations. Hence events, not patterns: each backend renders them its own
// way, and the call sites stop caring which one is present.
const HAPTICS = {
  landSoft: "landSoft",
  landHard: "landHard",
  crash:    "crash",
  penalty:  "penalty",
  fuelWarn: "fuelWarn",
  shout:    "shout",
  rumble:   "rumble",
};

// Web: the exact patterns the game shipped with, so the browser build is
// unchanged. Native: the closest thing the Taptic Engine offers.
const HAPTIC_MAP = {
  landSoft: { web: [18],          native: ["impact", "LIGHT"]         },
  landHard: { web: [55],          native: ["impact", "MEDIUM"]        },
  crash:    { web: [60, 40, 120], native: ["notification", "ERROR"]   },
  penalty:  { web: [180],         native: ["notification", "WARNING"] },
  fuelWarn: { web: [30, 70, 30],  native: ["notification", "WARNING"] },
  shout:    { web: [25, 50, 25],  native: ["impact", "LIGHT"]         },
  rumble:   { web: 220,           native: ["impact", "HEAVY"]         },
};

// ── Install and offline support ─────────────────────────────
// The manifest and this worker exist so the game can be installed and played
// offline — both preconditions for the native package rather than ends in
// themselves. Registration is guarded three ways because it is worthless in
// each of those cases and throws in the first.
function registerServiceWorker() {
  try {
    // file:// has no origin a worker could be scoped to
    if (location.protocol !== "http:" && location.protocol !== "https:") return;
    // Inside Capacitor the app is already served from the bundle; a worker
    // would cache a copy of files that are on the device anyway.
    if (window.Capacitor && window.Capacitor.isNativePlatform &&
        window.Capacitor.isNativePlatform()) return;
    if (!navigator.serviceWorker) return;
    const reg = navigator.serviceWorker.register("sw.js", { scope: "./" });
    if (reg && reg.catch) reg.catch(() => {});
  } catch (e) {
    // An install failure must never cost the player the game
  }
}

function nativeHaptics() {
  const cap = window.Capacitor;
  if (!cap || !cap.isNativePlatform || !cap.isNativePlatform()) return null;
  return (cap.Plugins && cap.Plugins.Haptics) || null;
}

function haptic(kind) {
  const spec = HAPTIC_MAP[kind];
  if (!spec) return;
  const plugin = nativeHaptics();
  if (plugin) {
    const [call, arg] = spec.native;
    try {
      // A misbehaving plugin must not take a landing down with it. The catch
      // covers a throw; the .catch covers a rejected promise, which the plugin
      // methods return and which try/catch alone would let escape as an
      // unhandled rejection.
      const p = call === "impact" ? plugin.impact({ style: arg })
                                  : plugin.notification({ type: arg });
      if (p && p.catch) p.catch(() => {});
    } catch (e) {}
    return;
  }
  vibrate(spec.web);
}

function vibrate(pattern) {
  if (!navigator.vibrate) return;
  try { navigator.vibrate(pattern); } catch (e) {}
}

// Continuous thrust rumble. Neither backend has a sustained mode, so a pulse is
// re-issued every 200ms and the overlap reads as one steady rumble. It costs
// battery on both. RUMBLE_STEPS is 12 simulation steps = 200ms at the fixed
// timestep; the web pulse is 220ms so it runs into the next one.
const RUMBLE_STEPS = 12;
let rumbleTick = 0;
let rumbling = false;

function hapticsAvailable() {
  return !!(navigator.vibrate || nativeHaptics());
}

function setThrustHaptics(active) {
  // Not a navigator.vibrate check any more: that API is missing on iOS, which
  // is the one platform the native build exists to reach — guarding on it would
  // have switched the rumble off exactly there.
  if (!hapticsAvailable()) return;
  if (active) {
    if (rumbleTick <= 0) { haptic(HAPTICS.rumble); rumbleTick = RUMBLE_STEPS; }
    rumbleTick--;
    rumbling = true;
  } else if (rumbling) {
    stopRumble();
  }
}

function stopRumble() {
  rumbling = false;
  rumbleTick = 0;
  // Only the web backend has anything to cancel: a taptic pulse is an event,
  // not a state, so there is nothing left running to switch off.
  if (!navigator.vibrate) return;
  try { navigator.vibrate(0); } catch (e) {}
}

const fullscreenBtn = document.getElementById("fullscreen-btn");
// iOS Safari has no element fullscreen — only show the button where it works.
if (isTouchDevice && document.documentElement.requestFullscreen) {
  fullscreenBtn.hidden = false;
  fullscreenBtn.addEventListener("click", () => {
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    else document.documentElement.requestFullscreen().catch(() => {});
  });
}

// ── Viewport (scaling, orientation gate, pause) ─────────────
// Never let the backing store grow past roughly 4K worth of pixels. On a large
// retina desktop, full-window * DPR 2-3 would otherwise mean a buffer the game
// clears in full every frame for no visible gain.
const MAX_BACKING_PIXELS = 3840 * 2160;

function layoutCanvas() {
  let availW, availH;
  if (isTouchDevice) {
    availW = window.innerWidth;
    availH = window.innerHeight;
  } else {
    // Measure the surrounding chrome rather than guessing at it: the
    // instruction block wraps to a different number of lines as the window
    // narrows. Its height does not depend on the canvas, so there is no loop.
    const instr = document.getElementById("instructions");
    const instrH = (instr && instr.offsetHeight) || 0;
    const border = 8;                        // 4px frame on each side
    availW = window.innerWidth  - border - 16;
    availH = window.innerHeight - border - instrH - 26;
  }

  // Uniform scale keeps the 8:5 world undistorted, so the tighter axis wins.
  // On a 16:9 monitor that is the height, which leaves side margins - the world
  // is a fixed 800x500 and cannot be widened without moving every level pad.
  const scale = Math.max(0.1, Math.min(availW / VIEW_W, availH / VIEW_H));
  const cssW = Math.floor(VIEW_W * scale);
  const cssH = Math.floor(VIEW_H * scale);

  let dpr = window.devicePixelRatio || 1;
  const budget = Math.sqrt(MAX_BACKING_PIXELS / Math.max(1, cssW * cssH));
  if (dpr > budget) dpr = Math.max(1, budget);

  canvas.style.width  = cssW + "px";
  canvas.style.height = cssH + "px";
  // DOM overlays sit in CSS pixels while the game thinks in world units
  viewScale = cssW / VIEW_W;
  canvas.width  = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);

  // Resizing the backing store resets all context state, so re-apply it here.
  ctx.setTransform(canvas.width / VIEW_W, 0, 0, canvas.height / VIEW_H, 0, 0);
  ctx.imageSmoothingEnabled = false;
}

let layoutQueued = false;
function queueLayout() {
  if (layoutQueued) return;
  layoutQueued = true;
  requestAnimationFrame(() => { layoutQueued = false; layoutCanvas(); });
}
window.addEventListener("resize", queueLayout);
window.addEventListener("orientationchange", queueLayout);
if (window.visualViewport) window.visualViewport.addEventListener("resize", queueLayout);

const portraitQuery = window.matchMedia("(orientation: portrait)");
let paused = false;
let windowBlurred = false;

function shouldPause() {
  return document.hidden || windowBlurred || (isTouchDevice && portraitQuery.matches);
}

// ── Input ───────────────────────────────────────────────────
// Keyboard and touch are tracked separately and merged per simulation step, so
// neither source can clear a hold owned by the other.
// "down" steers nothing in flight — the taxi has no downward thruster — and is
// carried only so the menus can be driven with either pair of arrows.
const kbHeld    = { up: false, down: false, left: false, right: false };
const touchHeld = { up: false, down: false, left: false, right: false };
const input     = { up: false, down: false, left: false, right: false, action: false };

const GAME_KEYS = {
  ArrowUp: "up", ArrowDown: "down",
  ArrowLeft: "left", ArrowRight: "right", Space: "action",
};

window.addEventListener("keydown", e => {
  const slot = GAME_KEYS[e.code];
  if (!slot) return;          // don't swallow F5, Cmd+R, Tab, devtools shortcuts
  e.preventDefault();
  unlockAudio();
  if (slot === "action") input.action = true;
  else kbHeld[slot] = true;
});

window.addEventListener("keyup", e => {
  const slot = GAME_KEYS[e.code];
  if (!slot || slot === "action") return;
  e.preventDefault();
  kbHeld[slot] = false;
});

const touchButtons = Array.from(document.querySelectorAll(".touch-controls__btn"));
const activePointers = new Map();   // pointerId -> button element (or null)

function buttonAt(x, y) {
  const el = document.elementFromPoint(x, y);
  return el && el.closest ? el.closest(".touch-controls__btn") : null;
}

function syncTouchState() {
  const held = new Set(activePointers.values());
  touchHeld.up = touchHeld.down = touchHeld.left = touchHeld.right = false;
  for (const btn of held) {
    if (btn) touchHeld[btn.dataset.input] = true;
  }
  for (const btn of touchButtons) {
    btn.classList.toggle("touch-controls__btn--active", held.has(btn));
  }
}

document.addEventListener("pointerdown", e => {
  unlockAudio();
  const btn = buttonAt(e.clientX, e.clientY);
  if (btn) {
    e.preventDefault();
    activePointers.set(e.pointerId, btn);
    syncTouchState();
  } else if (!e.target.closest || !e.target.closest(".fullscreen-btn")) {
    input.action = true;      // tap/click anywhere else = start / continue
  }
}, { passive: false });

// No setPointerCapture: re-resolving the element on every move is what lets a
// thumb slide from the left button onto the right one without lifting.
document.addEventListener("pointermove", e => {
  if (!activePointers.has(e.pointerId)) return;
  activePointers.set(e.pointerId, buttonAt(e.clientX, e.clientY));
  syncTouchState();
}, { passive: false });

function releasePointer(e) {
  if (!activePointers.delete(e.pointerId)) return;
  syncTouchState();
}
document.addEventListener("pointerup", releasePointer);
document.addEventListener("pointercancel", releasePointer);

function resetInput() {
  activePointers.clear();
  kbHeld.up = kbHeld.down = kbHeld.left = kbHeld.right = false;
  input.action = false;
  syncTouchState();
}

function actionHint(verb) {
  return (isTouchDevice ? "TAP TO " : "PRESS SPACE TO ") + verb;
}

// ── Game State ──────────────────────────────────────────────
// "menu" sits in front of the old title screen and is the only state added for
// multiplayer. Single player passes straight through it into the flow it always
// had, so nothing behind this point had to change.
let state = "menu";   // menu | title | playing | crashed | levelComplete | gameOver | win
let gameMode = "single";                        // single | multi
const MENU_ENTRIES = ["SINGLE PLAYER", "MULTIPLAYER"];
let menuIndex = 0;
let menuNavLatched = false;   // a held stick must move the cursor once, not per frame
let menuNotice = "";
let playerName = "PILOT";
let level = 0;
let score = 0;
let lives = 3;
let taxi, passengers, pads, obstacles, particles, messages;
let levelTimer;
let fareRefillTimer = 0;   // frames a free slot has been waiting for its refill
