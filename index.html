// ── Taxi Object ─────────────────────────────────────────────
function createTaxi() {
  return {
    x: 100, y: 80,
    vx: 0, vy: 0,
    w: 32, h: 18,
    fuel: 100,
    maxFuel: 100,
    landed: false,
    landedPad: -1,
    hasPassenger: false,
    passengerDest: -1,
    fareClaim: -1,    // index of the fare walking towards this taxi, or -1
    thrustUp: false,
    thrustLeft: false,
    thrustRight: false,
    angle: 0,
    gear: 0,          // 0 = retracted, 1 = fully deployed
  };
}

// ── Landing gear ────────────────────────────────────────────
const GEAR_LEN        = 5;    // how far the struts reach below the hull
const GEAR_DEPLOY     = 1/20; // ~0.33s to extend
const GEAR_RETRACT    = 1/45; // slower to fold back in
const GEAR_ZONE_X     = 30;   // horizontal slack around a landing surface
const GEAR_ZONE_Y     = 90;   // height above it at which the gear starts out

function nearLandingSurface() {
  const lvl = LEVELS[level];
  const surfaces = pads.concat(lvl.fuelStations || []);
  const bottom = taxi.y + taxi.h;
  for (const s of surfaces) {
    const overX = taxi.x + taxi.w > s.x - GEAR_ZONE_X && taxi.x < s.x + s.w + GEAR_ZONE_X;
    const overY = bottom > s.y - GEAR_ZONE_Y && bottom <= s.y + 16;
    if (overX && overY) return true;
  }
  return false;
}

// ── Particles ───────────────────────────────────────────────
function spawnParticle(x, y, vx, vy, color, life) {
  particles.push({ x, y, vx, vy, color, life, maxLife: life });
}
function spawnExplosion(x, y) {
  for (let i = 0; i < 30; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = Math.random() * 3 + 1;
    const c = [C.hotOrange, C.hotYellow, C.red, C.white][Math.floor(Math.random()*4)];
    spawnParticle(x, y, Math.cos(a)*s, Math.sin(a)*s, c, 40 + Math.random()*30);
  }
}
function spawnThrustParticles(x, y, dir) {
  for (let i = 0; i < 2; i++) {
    const c = [C.hotOrange, C.hotYellow, C.white][Math.floor(Math.random()*3)];
    let vx = (Math.random()-0.5)*0.5;
    let vy = (Math.random()-0.5)*0.5;
    if (dir === "up")    vy = Math.random()*2+1;
    if (dir === "left")  vx = Math.random()*2+1;
    if (dir === "right") vx = -(Math.random()*2+1);
    spawnParticle(x, y, vx, vy, c, 10+Math.random()*10);
  }
}

// ── Messages (floating text) ────────────────────────────────
function addMessage(text, x, y, color = C.hotYellow, duration = 90) {
  messages.push({ text, x, y, color, life: duration, maxLife: duration });
}

// ── Seeded randomness for the simulation ────────────────────
// Anything that changes the outcome of a run draws from rng(), never from
// Math.random(). Particles, flames and stars deliberately keep Math.random():
// they are drawn per rendered frame, so letting them consume seeded numbers
// would make the sequence depend on the display refresh rate.
//
// One runSeed determines a whole game. Retries still get a fresh route, because
// the draw counter advances on every initLevel() — the run stays reproducible
// as a whole without freezing a level you are practising.
let runSeed = 0;
let rngState = 0;
let initCount = 0;

function rng() {                                   // mulberry32
  rngState = (rngState + 0x6D2B79F5) | 0;
  let t = Math.imul(rngState ^ (rngState >>> 15), 1 | rngState);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

function newRunSeed() {
  runSeed = (Math.random() * 4294967296) >>> 0;
  initCount = 0;
}

// ?seed=12345 replays an entire run - handy for practising and bug reports
const forcedSeed = (() => {
  try {
    const raw = new URLSearchParams(location.search).get("seed");
    if (raw === null) return null;
    const n = Number(raw);
    return Number.isFinite(n) ? (n >>> 0) : null;
  } catch (e) { return null; }
})();

// ── Network ─────────────────────────────────────────────────
// The Phoenix channel protocol, spoken by hand. The official client is an npm
// package, and this game has no build step and ships as one file — so instead
// of pulling in a bundler for it, the wire format is written out here. It is
// small: every frame is [join_ref, ref, topic, event, payload].
//
// Only what has to agree between players goes through here. The taxi is still
// simulated locally and without delay, which is the whole reason the controls
// feel the same online as they do alone.
const NET_POS_EVERY = 4;         // simulation steps between position sends: 15 Hz
const NET_HEARTBEAT_EVERY = 60 * 25;   // 25s; the ingress cuts idle sockets at 60
const REMOTE_SMOOTH = 0.25;      // how fast a remote taxi closes on its target

let socket = null;
let netState = "idle";           // idle | connecting | joining | joined | failed | closed
let netError = "";
let netRoom = "";
let netRef = 0;
let netJoinRef = null;
let netPosTick = 0;
let netBeatTick = 0;
let myPlayerId = null;
let roomState = null;
const remotes = new Map();       // player id -> interpolated taxi

// Used when the page has no origin worth deriving from: a double-clicked file,
// or the native bundle, where the app's own origin is not a server.
const DEFAULT_SERVER = "ws://localhost:4000/socket/websocket";

function netUrl() {
  try {
    // 1. The query string, which is how the web build is pointed anywhere
    const forced = new URLSearchParams(location.search).get("server");
    if (forced) return forced;

    // 2. Baked into the copied page by scripts/build-www.js. An app does not
    //    launch with a query string, so this is how the native package is told
    //    where its server is.
    const meta = document.querySelector('meta[name="taxi-server"]');
    const configured = meta && meta.getAttribute("content");
    if (configured) return configured;

    // 3. The page's own origin — right when client and server ship together,
    //    and only meaningful over http(s). capacitor: and file: both land below.
    if (location.protocol === "http:" || location.protocol === "https:") {
      const scheme = location.protocol === "https:" ? "wss:" : "ws:";
      return scheme + "//" + location.host + "/socket/websocket";
    }

    return DEFAULT_SERVER;
  } catch (e) {
    return DEFAULT_SERVER;
  }
}

function netTopic() { return "room:" + netRoom; }

function netSend(topic, event, payload, joinRef) {
  if (!socket || socket.readyState !== 1) return null;
  const ref = String(++netRef);
  socket.send(JSON.stringify([joinRef === undefined ? netJoinRef : joinRef,
                              ref, topic, event, payload]));
  return ref;
}

function netConnect(room) {
  netDisconnect();
  netRoom = room;
  netError = "";
  netState = "connecting";
  remotes.clear();
  roomState = null;
  myPlayerId = null;
  netPosTick = 0;
  netBeatTick = 0;

  const url = netUrl() + "?vsn=2.0.0&name=" + encodeURIComponent(playerName);
  try {
    socket = new WebSocket(url);
  } catch (e) {
    netState = "failed";
    netError = "NO CONNECTION";
    return;
  }

  socket.onopen = () => {
    netState = "joining";
    netJoinRef = String(++netRef);
    socket.send(JSON.stringify([netJoinRef, netJoinRef, netTopic(), "phx_join", {}]));
  };
  socket.onmessage = e => {
    let frame;
    try { frame = JSON.parse(e.data); } catch (err) { return; }
    netReceive(frame);
  };
  socket.onerror = () => {
    if (netState !== "joined") { netState = "failed"; netError = "NO CONNECTION"; }
  };
  socket.onclose = () => {
    // Only a session that got somewhere counts as closed; one that never
    // connected stays "failed", so the screen can say which it was.
    netState = netState === "joined" ? "closed" : (netState === "failed" ? "failed" : "failed");
    if (!netError) netError = "CONNECTION LOST";
  };
}

function netDisconnect() {
  if (socket) {
    socket.onopen = socket.onmessage = socket.onerror = socket.onclose = null;
    try { socket.close(); } catch (e) {}
  }
  socket = null;
  netState = "idle";
  netError = "";
  netJoinRef = null;
  remotes.clear();
  roomState = null;
  myPlayerId = null;
}

function netReceive([joinRef, ref, topic, event, payload]) {
  if (event === "phx_reply") {
    if (pendingClaims.has(ref)) {
      resolveClaim(ref, payload && payload.status === "ok");
      return;
    }
    if (ref === netJoinRef) {
      if (payload && payload.status === "ok") {
        netState = "joined";
        myPlayerId = payload.response.player_id;
        applyRoomState(payload.response.state);
        // Start straight away rather than waiting for a keypress: the player
        // already chose multiplayer, and the lobby is a wait, not a menu.
        if (state === "lobby") startOnlineRun();
      } else {
        netState = "failed";
        netError = ((payload && payload.response && payload.response.reason) ||
                    "REFUSED").toUpperCase();
      }
    }
    return;
  }
  if (event === "state") applyRoomState(payload);
  else if (event === "pos") applyRemotePos(payload);
}

function applyRoomState(next) {
  if (!next) return;
  roomState = next;
  // Drop whoever left. Adding is left to the position updates: a player with no
  // position yet has nothing to draw anyway.
  for (const id of [...remotes.keys()]) {
    if (!next.players || !next.players[id]) remotes.delete(id);
  }
  for (const id of Object.keys(next.players || {})) {
    if (id === myPlayerId || remotes.has(id)) continue;
    remotes.set(id, {
      id, x: 0, y: 0, tx: 0, ty: 0, seen: false,
      vx: 0, vy: 0, angle: 0, gear: 0, thrust: 0, w: 32, h: 18,
    });
  }

  // Only once a level is standing — the join reply arrives before it exists.
  // Not gated on "playing": the state that follows a crash is exactly the one
  // carrying the life it cost, and ignoring it there would lose the count.
  if (pads.length && (state === "playing" || state === "crashed")) {
    applyServerWorld();
    applyServerPlayers();
    syncFaresFromServer();
  }
}

function applyRemotePos(p) {
  if (!p || !p.id || p.id === myPlayerId) return;
  let r = remotes.get(p.id);
  if (!r) {
    r = { id: p.id, x: p.x, y: p.y, tx: p.x, ty: p.y, seen: false,
          vx: 0, vy: 0, angle: 0, gear: 0, thrust: 0, w: 32, h: 18 };
    remotes.set(p.id, r);
  }
  r.tx = p.x;
  r.ty = p.y;
  r.vx = p.vx || 0;
  r.vy = p.vy || 0;
  r.angle = p.a || 0;
  r.gear = p.g || 0;
  r.thrust = p.t || 0;
  // The first sighting snaps. Anything else would have the taxi slide in from
  // the origin, across the whole world.
  if (!r.seen) { r.x = p.x; r.y = p.y; r.seen = true; }
  else {
    // One step of the smoothing is taken here rather than waiting for the next
    // frame, so a fresh update is visible immediately.
    r.x += (r.tx - r.x) * REMOTE_SMOOTH;
    r.y += (r.ty - r.y) * REMOTE_SMOOTH;
  }
}

// Positions arrive at 15 Hz and the screen runs at 60, so the gaps are filled
// by easing towards the last known target. Not dead reckoning: extrapolating
// along vx/vy overshoots every time a player stops, and a taxi that slides past
// a pad and back looks worse than one that arrives a frame late.
function updateRemotes() {
  for (const r of remotes.values()) {
    r.x += (r.tx - r.x) * REMOTE_SMOOTH;
    r.y += (r.ty - r.y) * REMOTE_SMOOTH;
  }
}

function netActive() { return netState === "joined"; }

// Positions, from the simulation step — there is nothing to report about a
// taxi that is not moving because the game is not running.
function netTick() {
  if (!netActive() || !taxi) return;

  if (++netPosTick >= NET_POS_EVERY) {
    netPosTick = 0;
    sendPosition();
  }
}

function sendPosition() {
  netSend(netTopic(), "pos", {
    x: Math.round(taxi.x * 10) / 10,
    y: Math.round(taxi.y * 10) / 10,
    vx: Math.round(taxi.vx * 100) / 100,
    vy: Math.round(taxi.vy * 100) / 100,
    a: Math.round(taxi.angle * 100) / 100,
    g: Math.round(taxi.gear * 100) / 100,
    t: taxi.thrustUp ? 1 : 0,
  });
}

// The heartbeat, from the frame loop rather than the simulation step. update()
// returns immediately unless the state is "playing", so a heartbeat living
// there stops the moment a player is wrecked, waiting on a level or sitting in
// the lobby — and the socket is dropped 45s later, in exactly the quiet
// stretches it exists to survive.
function netHeartbeat() {
  if (!netActive()) return;
  if (++netBeatTick >= NET_HEARTBEAT_EVERY) {
    netBeatTick = 0;
    netSend("phoenix", "heartbeat", {}, null);
  }
}

// A wrecked taxi is still on everyone's screen, but update() has stopped, so it
// stops reporting where it is. Anyone joining after that never hears a position
// for it: they see the player in the standings and no taxi anywhere on the map.
// It is not moving, so a couple of times a second is plenty — it only has to be
// locatable, not smooth.
const NET_IDLE_POS_EVERY = 30;
let netIdleTick = 0;

function netIdlePosition() {
  if (!netActive() || !taxi) return;
  // "playing" already reports at 15 Hz from the simulation step; once the round
  // is over there is nothing left to draw.
  if (state !== "crashed" && state !== "levelComplete") { netIdleTick = 0; return; }
  if (++netIdleTick < NET_IDLE_POS_EVERY) return;
  netIdleTick = 0;
  sendPosition();
}

// Everything the network needs once per frame. Outside the simulation step on
// purpose: both of these have to keep running in the states where update() does
// not, which is exactly when they matter.
function netFrame() {
  netHeartbeat();
  netIdlePosition();
}

// ── Server-owned game state ─────────────────────────────────
// Lives, score and the end of the round belong to the server, so online they
// are copied in rather than counted here. The fares are the same story: the
// local board generates nothing while online, it mirrors what the room holds.
// The room's world grows and shrinks with the player count, and initLevel only
// reads it once. Without this a player who joined alone stays penned inside one
// sector while everyone who arrived later flies a world four times the size —
// so each is regularly somewhere the other's screen cannot reach.
function applyServerWorld() {
  if (!roomState || !roomState.world_w || !roomState.world_h) return;
  if (worldW === roomState.world_w && worldH === roomState.world_h) return;
  worldW = roomState.world_w;
  worldH = roomState.world_h;
  buildStarField();   // the old field only covered the old area
  clampCamera();      // a shrunk world can leave the view outside it
}

function applyServerPlayers() {
  if (!roomState || !roomState.players || !myPlayerId) return;
  const me = roomState.players[myPlayerId];
  if (me) {
    lives = me.lives;
    score = me.score;
  }
  // A player with no lives left waits for the round to end rather than being
  // thrown out: the room finishes when everyone is out or someone wins.
  if (roomState.phase === "over" && state !== "gameOver") {
    state = "gameOver";
    sndSad();
  }
}

// Every client has to put a passenger in the same spot, or two players aim at
// figures standing somewhere else on each other's screens. The fare id is the
// only thing both sides agree on, so the position is derived from it rather
// than rolled — the seeded RNG is per-run and would not match.
function fareHash(id) {
  let h = 2166136261;
  for (let i = 0; i < id.length; i++) {
    h ^= id.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return ((h >>> 0) % 1000) / 1000;
}

function serverStandX(pad, fareId) {
  const span = pad.w * 0.32;
  const t = fareHash(fareId);
  const left = t < 0.5;
  const along = (t * 2 % 1) * span;
  return left ? pad.x + PERSON_MARGIN + along
              : pad.x + pad.w - PERSON_MARGIN - along;
}

// ── Claiming a fare over the wire ───────────────────────────
// The reply decides whether the passenger walks or vanishes, so the ref is kept
// and matched. Without that a refusal would be indistinguishable from silence.
const pendingClaims = new Map();     // reply ref -> fare id

function claimFromServer(p) {
  const ref = netSend(netTopic(), "claim", { fare: p.fareId });
  if (ref === null) {
    // Nothing went out, so nothing will come back. Put them back on the pad
    // rather than leaving a passenger frozen mid-claim forever.
    p.phase = "waiting";
    if (taxi.fareClaim === p.index) taxi.fareClaim = -1;
    return;
  }
  pendingClaims.set(ref, p.fareId);
}

function resolveClaim(ref, ok) {
  const fareId = pendingClaims.get(ref);
  if (fareId === undefined) return;
  pendingClaims.delete(ref);

  const idx = passengers.findIndex(p => p.fareId === fareId);
  if (idx === -1) return;
  const p = passengers[idx];
  if (p.phase !== "claiming") return;

  if (ok) {
    p.phase = "boarding";
  } else {
    // Someone else got there first. They are in another taxi now.
    if (taxi.fareClaim === p.index) taxi.fareClaim = -1;
    passengers.splice(idx, 1);
    addMessage("TOO SLOW!", taxi.x + taxi.w/2, taxi.y - 20, C.lightRed, 60);
  }
}

// ── Taxi against taxi ───────────────────────────────────────
// Detected locally by whoever notices it, then reported; the server settles it
// for both. A minimum closing speed keeps a slow drift together at a pad from
// costing two lives, which is the difference between a collision and parking.
const COLLIDE_MIN_REL_V = 1.5;
const COLLIDE_COOLDOWN = 60;         // frames before the same pair counts again
const collideCooldown = new Map();   // player id -> frames left

function updateRemoteCollisions() {
  for (const [id, left] of collideCooldown) {
    if (left <= 1) collideCooldown.delete(id);
    else collideCooldown.set(id, left - 1);
  }
  if (!taxi || taxi.landed) return;

  for (const r of remotes.values()) {
    if (!r.seen || collideCooldown.has(r.id)) continue;
    if (!rectOverlap({ x: taxi.x, y: taxi.y, w: taxi.w, h: taxi.h },
                     { x: r.x, y: r.y, w: r.w, h: r.h })) continue;

    const dvx = taxi.vx - r.vx;
    const dvy = taxi.vy - r.vy;
    if (Math.sqrt(dvx*dvx + dvy*dvy) < COLLIDE_MIN_REL_V) continue;

    collideCooldown.set(r.id, COLLIDE_COOLDOWN);
    netSend(netTopic(), "collide", { with: r.id });
    // Shown at once; the life itself arrives with the server's next state.
    spawnExplosion(taxi.x + taxi.w/2, taxi.y + taxi.h/2);
    sndExplosion() || sndCrash();
    haptic(HAPTICS.crash);
    addMessage("BANG!", taxi.x + taxi.w/2, taxi.y - 20, C.lightRed, 60);
  }
}

// Mirror the room's fare list onto the local board. Fares someone else has
// claimed leave this board entirely: their passenger is in another taxi.
function syncFaresFromServer() {
  if (!roomState || !roomState.fares || !pads.length) return;
  const wanted = roomState.fares;

  for (let i = passengers.length - 1; i >= 0; i--) {
    const p = passengers[i];
    const f = wanted[p.fareId];
    const mine = f && f.claimed_by === myPlayerId;
    // Keep whoever is already in the taxi: the server drops a delivered fare
    // from the list, and removing the passenger mid-ride would strand the taxi
    // with hasPassenger set and nobody to hand over.
    if (p.phase === "aboard") continue;
    if (!f || (f.claimed_by && !mine)) passengers.splice(i, 1);
  }

  for (const id of Object.keys(wanted)) {
    const f = wanted[id];
    if (f.claimed_by && f.claimed_by !== myPlayerId) continue;
    if (passengers.some(p => p.fareId === id)) continue;
    if (!pads[f.from] || !pads[f.to]) continue;
    passengers.push({
      fareId: id,
      padIndex: f.from,
      destPadIndex: f.to,
      x: serverStandX(pads[f.from], id),
      phase: "waiting",
      active: true,
      heyTimer: 0,
      heyCount: 0,
      index: passengers.length,
    });
  }
}

// ── Route generation ────────────────────────────────────────
// Independent random pairs: every fare rolls its own pickup and destination
// pad, so the taxi regularly has to fly an empty leg to the next pickup.
// A fresh route is rolled on every initLevel() — including after a crash.
const PERSON_HALF_W = 8;   // half the sprite width, used for the crush box
const PERSON_MARGIN = 16;  // keep the passenger clear of the pad edges
const PERSON_WALK   = 0.8; // px per 1/60s step while boarding
const HEY_SHOUTS    = 2;   // calls for a taxi per fare — the first one is free
const HEY_REPEAT    = 300; // 5s at 60fps between the first shout and the second

// ── Fare board ──────────────────────────────────────────────
// Single player releases one fare at a time and the next only after the
// previous has been dropped off. The multiplayer economy needs several standing
// at once and a replacement as soon as one is picked up — without a base supply
// eight of ten players lose every race, and whoever comes second three times
// running stops playing.
//
// Both are the same rule with different numbers, so the level carries the
// policy. The defaults reproduce single player exactly, which is why the five
// existing levels declare none of these fields.
const FARE_POLICY_DEFAULTS = {
  activeFares: 1,            // how many fares may stand on the board at once
  refillOn: "delivered",     // when a fare frees its slot: "delivered" | "aboard"
  refillDelay: 0,            // frames between a slot falling free and the refill
};

function farePolicy(lvl) {
  return {
    activeFares: lvl.activeFares || FARE_POLICY_DEFAULTS.activeFares,
    refillOn:    lvl.refillOn    || FARE_POLICY_DEFAULTS.refillOn,
    refillDelay: lvl.refillDelay === undefined
                   ? FARE_POLICY_DEFAULTS.refillDelay : lvl.refillDelay,
  };
}

// A fare holds its slot until it reaches the state that frees one
function occupiesSlot(p, refillOn) {
  if (p.phase === "queued" || p.phase === "delivered") return false;
  return refillOn === "aboard" ? p.phase !== "aboard" : true;
}

function makeFare(i, padCount) {
  return {
    ...randomFare(padCount),
    x: 0,
    // queued -> waiting -> boarding (walking to the taxi) -> aboard -> delivered
    phase: "queued",
    active: false,
    heyTimer: 0,
    heyCount: 0,
    index: i,
  };
}

function activateFare(p) {
  p.phase = "waiting";
  p.active = true;
  p.heyTimer = 0;
  p.heyCount = 0;
  p.x = passengerStandX(pads[p.padIndex], taxi.landed && taxi.landedPad === p.padIndex);
}

// The next fare to put out. A fixed pool runs dry and the level ends; an economy
// tops itself up, because a running economy has no last fare.
function nextQueuedFare(pol) {
  const queued = passengers.find(p => p.phase === "queued");
  if (queued) return queued;
  if (pol.refillOn !== "aboard") return null;
  const fresh = makeFare(passengers.length, pads.length);
  passengers.push(fresh);
  return fresh;
}

// Put the base supply out at level start, all at once — the refill delay paces
// replacements during play, it should not make the opening trickle in.
function fillFareBoard() {
  const pol = farePolicy(LEVELS[level]);
  for (let guard = 0; guard < pol.activeFares; guard++) {
    let liveCount = 0;
    for (const p of passengers) if (occupiesSlot(p, pol.refillOn)) liveCount++;
    if (liveCount >= pol.activeFares) break;
    const next = nextQueuedFare(pol);
    if (!next) break;
    activateFare(next);
  }
  fareRefillTimer = 0;
}

function updateFareBoard() {
  const pol = farePolicy(LEVELS[level]);
  let liveCount = 0;
  for (const p of passengers) if (occupiesSlot(p, pol.refillOn)) liveCount++;
  if (liveCount >= pol.activeFares) { fareRefillTimer = 0; return; }
  if (fareRefillTimer < pol.refillDelay) { fareRefillTimer++; return; }
  const next = nextQueuedFare(pol);
  if (!next) return;
  activateFare(next);
  fareRefillTimer = 0;
}

function randomFare(padCount) {
  const from = Math.floor(rng() * padCount);
  let to = Math.floor(rng() * (padCount - 1));
  if (to >= from) to++;                    // never deliver to the pickup pad
  return { padIndex: from, destPadIndex: to };
}

// The passenger stands in the left or right third of the pad, so the player has
// to look before choosing a touchdown spot.
//
// Rolled at activation time, not at level start: with random routes a fare can
// begin on the very pad the taxi is still parked on after the previous drop-off,
// and spawning under the hull would be an unavoidable death.
function passengerStandX(pad, avoidTaxi) {
  const span = pad.w * 0.32;
  const spots = [
    pad.x + PERSON_MARGIN + rng() * span,
    pad.x + pad.w - PERSON_MARGIN - rng() * span,
  ];
  if (!avoidTaxi) return spots[Math.floor(rng() * spots.length)];

  const lo = taxi.x - PERSON_HALF_W - 2;
  const hi = taxi.x + taxi.w + PERSON_HALF_W + 2;
  const clear = spots.filter(x => x < lo || x > hi);
  if (clear.length) return clear[Math.floor(rng() * clear.length)];

  // Both rolls landed under the taxi — stand at the far edge of the deck
  return taxi.x + taxi.w/2 - pad.x > pad.w/2
    ? pad.x + PERSON_MARGIN
    : pad.x + pad.w - PERSON_MARGIN;
}

// ── Init Level ──────────────────────────────────────────────
function initLevel() {
  // Advance the draw counter first: a retry of the same level gets a different
  // route, yet the whole run replays identically from the same runSeed.
  rngState = (runSeed + Math.imul(++initCount, 0x9E3779B9)) | 0;

  const lvl = LEVELS[level];
  // Online the world size comes from the room: it grows with the player count,
  // which the client has no way of knowing on its own.
  worldW = netActive() && roomState ? roomState.world_w : (lvl.cols || 1) * SECTOR_W;
  worldH = netActive() && roomState ? roomState.world_h : (lvl.rows || 1) * SECTOR_H;
  buildStarField();

  taxi = createTaxi();
  pads = lvl.pads.map(p => ({ ...p }));
  if (netActive()) {
    // The room owns the fares. Generating any here would put passengers on this
    // screen that no other player can see.
    passengers = [];
    syncFaresFromServer();
  } else {
    // Every fare starts queued; fillFareBoard puts out as many as the policy
    // allows, so the placement roll happens at activation time for all of them.
    passengers = Array.from({ length: lvl.fares }, (_, i) => makeFare(i, pads.length));
    fillFareBoard();
  }
  obstacles = lvl.obstacles.map(o => ({ ...o }));
  particles = [];
  messages = [];
  levelTimer = 0;
  state = "playing";
  hideExplosion();
  // Placed relative to the taxi, not the world centre: in a multi-sector world
  // the centre can sit far outside the view.
  addMessage(lvl.name, taxi.x + taxi.w/2, taxi.y + 90, C.skyBlue, 120);
  centerCameraOnTaxi();   // no pan on the first frame of a level
}

// ── Touchdown ───────────────────────────────────────────────
// Pads and fuel stations are both flat surfaces the taxi can settle on, and
// every rule below applies to both. Keeping one implementation is not about
// line count: the gear gate, the resting height and the landing thump each had
// to be written twice before, and a third divergence was only a matter of time.
const MAX_LAND_VY  = 1.8;   // faster than this on touchdown is a wreck
const MAX_LAND_VX  = 1.5;
const PAD_SNAP     = 12;    // how far below the deck still counts as contact
const FUEL_SNAP    = 14;    // fuel stations are a touch more forgiving

// Returns "none" | "crash" | "land". On "crash" the caller must abort the step.
function tryTouchdown(surface, snap, gearDrop, wasAirborne) {
  const overX = taxi.x + taxi.w > surface.x + 4 && taxi.x < surface.x + surface.w - 4;
  const feet  = taxi.y + taxi.h + gearDrop;
  if (!overX || taxi.vy < 0 || feet < surface.y || feet > surface.y + snap) return "none";

  if (taxi.gear < 1) { crash("GEAR NOT DOWN!"); return "crash"; }
  if (taxi.vy > MAX_LAND_VY || Math.abs(taxi.vx) > MAX_LAND_VX) { crash(); return "crash"; }

  if (wasAirborne) touchdownFeedback(taxi.vy);
  taxi.y  = surface.y - taxi.h - GEAR_LEN;   // rest on the feet, not the hull
  taxi.vx = 0;
  taxi.vy = 0;
  taxi.landed = true;
  return "land";
}

// ── Touchdown feedback ──────────────────────────────────────
// Impact speed drives both the thump and the buzz. The crash threshold is
// vy > 1.8, so anything above ~1.0 is a firm arrival worth feeling.
function touchdownFeedback(impactVy) {
  const hard = impactVy > 1.0;
  beep(hard ? 90 : 150, hard ? 0.09 : 0.05, "square", hard ? 0.09 : 0.04);
  haptic(hard ? HAPTICS.landHard : HAPTICS.landSoft);
}

// ── Collision helpers ───────────────────────────────────────
function rectOverlap(a, b) {
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}

// ── Update ──────────────────────────────────────────────────
function update() {
  if (state !== "playing") return;
  const lvl = LEVELS[level];
  levelTimer++;

  // ─ Input ─
  taxi.thrustUp    = input.up;
  taxi.thrustLeft  = input.left;
  taxi.thrustRight = input.right;

  // ─ Physics ─
  // If landed but thrusting, take off
  if (taxi.landed && taxi.thrustUp && taxi.fuel > 0) {
    taxi.landed = false;
    taxi.landedPad = -1;
    taxi.vy = -0.5; // small upward kick to clear the pad
  }

  if (!taxi.landed) {
    taxi.vy += lvl.gravity;

    if (taxi.thrustUp && taxi.fuel > 0)    { taxi.vy -= 0.12; taxi.fuel -= 0.12; }
    if (taxi.thrustLeft && taxi.fuel > 0)  { taxi.vx -= 0.08; taxi.fuel -= 0.06; }
    if (taxi.thrustRight && taxi.fuel > 0) { taxi.vx += 0.08; taxi.fuel -= 0.06; }

    // Drag
    taxi.vx *= 0.995;
    taxi.vy *= 0.998;

    taxi.x += taxi.vx;
    taxi.y += taxi.vy;

    // Thrust particles (engine sound is driven from gameLoop, not per-step)
    if (taxi.thrustUp && taxi.fuel > 0) {
      spawnThrustParticles(taxi.x + taxi.w/2, taxi.y + taxi.h, "up");
    }
    // Exhaust leaves the side OPPOSITE the direction of travel: thrusting left
    // fires the starboard jet, and vice versa.
    if (taxi.thrustLeft && taxi.fuel > 0)
      spawnThrustParticles(taxi.x + taxi.w, taxi.y + taxi.h/2, "left");
    if (taxi.thrustRight && taxi.fuel > 0)
      spawnThrustParticles(taxi.x, taxi.y + taxi.h/2, "right");
  } else {
    taxi.vx = 0;
    taxi.vy = 0;
  }

  // Fuel warning
  if (taxi.fuel < 20 && taxi.fuel > 0 && levelTimer % 60 === 0) sndFuelWarn();
  if (taxi.fuel <= 0) taxi.fuel = 0;

  // ─ Boundary check ─
  if (taxi.x < 0) { taxi.x = 0; taxi.vx = 0; }
  if (taxi.x + taxi.w > worldW) { taxi.x = worldW - taxi.w; taxi.vx = 0; }
  if (taxi.y < 0) { taxi.y = 0; taxi.vy = 0; }

  // Floor crash
  if (taxi.y + taxi.h > worldH) {
    crash();
    return;
  }

  // ─ Landing gear ─
  // Extends automatically near any landing surface; touching down before it is
  // fully out is a crash, so a dive-bomb approach can never stick a landing.
  const wantGear = taxi.landed || nearLandingSurface();
  taxi.gear = Math.max(0, Math.min(1,
    taxi.gear + (wantGear ? GEAR_DEPLOY : -GEAR_RETRACT)));
  const gearDrop = GEAR_LEN * taxi.gear;

  // ─ Obstacle collision ─
  const taxiRect = { x: taxi.x, y: taxi.y, w: taxi.w, h: taxi.h };
  for (const obs of obstacles) {
    if (rectOverlap(taxiRect, obs)) {
      crash();
      return;
    }
  }

  // ─ Pad landing / collision ─
  // Landing is re-detected every step while the taxi rests on a pad, so the
  // touchdown thump has to fire on the edge, not on the state.
  const wasAirborne = !taxi.landed;
  taxi.landed = false;
  taxi.landedPad = -1;
  for (let i = 0; i < pads.length; i++) {
    const result = tryTouchdown(pads[i], PAD_SNAP, gearDrop, wasAirborne);
    if (result === "crash") return;
    if (result === "land") taxi.landedPad = i;
  }

  // ─ Fuel station ─
  if (lvl.fuelStations) {
    for (const fs of lvl.fuelStations) {
      const result = tryTouchdown(fs, FUEL_SNAP, gearDrop, wasAirborne);
      if (result === "crash") return;
      if (result !== "land") continue;

      // Refuel — but never with a fare aboard. Triggers on the first drop of
      // fuel actually taken, so merely touching down with a full tank is free.
      if (taxi.fuel < taxi.maxFuel) {
        if (taxi.hasPassenger) {
          refuelViolation();
          return;
        }
        taxi.fuel = Math.min(taxi.maxFuel, taxi.fuel + 0.5);
        if (levelTimer % 30 === 0) beep(440, 0.05, "sine", 0.04);
      }
    }
  }

  // ─ Passenger logic ─
  // Online the room hands out fares; the local board would only invent extras
  // that nobody else can see.
  if (netActive()) { netTick(); updateRemoteCollisions(); }
  else updateFareBoard();

  for (const p of passengers) {
    if (p.phase === "delivered") continue;

    if (p.phase === "queued") continue;   // the fare board decides when it is put out
    // Waiting on the server to say whether this fare is ours
    if (p.phase === "claiming") continue;

    const pad = pads[p.padIndex];

    // Standing on the pad, waving for a taxi. Two shouts only: one the moment
    // the fare is ready, a reminder five seconds later, then silence — an
    // endless loop wore thin long before the pad was reached.
    if (p.phase === "waiting") {
      if (p.heyCount < HEY_SHOUTS && p.heyTimer >= (p.heyCount === 0 ? 0 : HEY_REPEAT)) {
        addMessage("HEY TAXI!", pad.x + pad.w/2, pad.y - 30, C.hotYellow, 60);
        sndHeyTaxi();
        p.heyCount++;
        p.heyTimer = 0;
      }
      p.heyTimer++;

      // Land on top of them and they are gone
      if (rectOverlap(
            { x: taxi.x, y: taxi.y, w: taxi.w, h: taxi.h + gearDrop },
            { x: p.x - PERSON_HALF_W, y: pad.y - 14, w: PERSON_HALF_W * 2, h: 14 })) {
        crash("PASSENGER CRUSHED!");
        return;
      }

      // Landed safely beside them — they start walking over. With several fares
      // on one pad the first to reach the taxi claims it; the rest keep waiting
      // rather than all piling into the same cab. This is the local shape of the
      // server's first-come-first-served rule.
      if (taxi.landed && taxi.landedPad === p.padIndex &&
          !taxi.hasPassenger && taxi.fareClaim === -1) {
        if (netActive()) {
          // Online the room settles who gets the fare, so ask before letting
          // anyone walk. Two players landing at once both see them standing
          // there; only one gets an ok back.
          p.phase = "claiming";
          taxi.fareClaim = p.index;
          claimFromServer(p);
        } else {
          p.phase = "boarding";
          taxi.fareClaim = p.index;
        }
      }
    }

    // Walking across the pad towards the taxi door
    else if (p.phase === "boarding") {
      // Taxi left before they made it — go back to waiting where they stand
      if (!taxi.landed || taxi.landedPad !== p.padIndex || taxi.hasPassenger) {
        p.phase = "waiting";
        p.heyTimer = 0;
        if (taxi.fareClaim === p.index) taxi.fareClaim = -1;
      } else {
        const door = taxi.x + taxi.w/2;
        const dx = door - p.x;
        p.x += Math.sign(dx) * Math.min(PERSON_WALK, Math.abs(dx));

        if (Math.abs(dx) <= PERSON_WALK) {
          p.phase = "aboard";
          taxi.hasPassenger = true;
          taxi.passengerDest = p.destPadIndex;
          taxi.fareClaim = -1;        // hasPassenger guards the seat from here on
          sndPickup();
          const destPad = pads[p.destPadIndex];
          addMessage("TO PAD " + destPad.label + "!", taxi.x + taxi.w/2, taxi.y - 20, C.padGreen, 90);
          if (!netActive()) score += 10;   // online the server scores the pickup
        }
      }
    }

    // Drop off
    else if (p.phase === "aboard") {
      if (taxi.landed && taxi.landedPad === p.destPadIndex) {
        p.phase = "delivered";
        taxi.hasPassenger = false;
        taxi.passengerDest = -1;
        sndDropoff();
        addMessage("$" + 50 + " TIP!", taxi.x + taxi.w/2, taxi.y - 20, C.padGreen, 60);
        totalPassengersDelivered++;
        // Online the score is the server's to keep; it arrives with the next
        // state. Adding here as well would double it until that lands.
        if (netActive()) netSend(netTopic(), "deliver",
                                 { fare: p.fareId, pad: p.destPadIndex });
        else score += 50;
      }
    }
  }

  // ─ Check level complete ─
  // A fixed pool can be worked through; an economy tops itself up and therefore
  // has no last fare, so it never ends this way.
  if (farePolicy(LEVELS[level]).refillOn !== "aboard" &&
      passengers.every(p => p.phase === "delivered")) {
    state = "levelComplete";
    sndLevelUp();
    score += 100; // level bonus
  }

  // ─ Update particles ─
  updateParticles();
  updateMessages();
}

// Shared ending for every life-losing event. Clearing the rumble flags without
// cancelling matters: gameLoop would otherwise see a stale `rumbling` this frame
// and fire vibrate(0) straight over the buzz we just sent.
function loseLife(reason) {
  crashReason = reason;
  rumbling = false;
  rumbleTick = 0;
  if (netActive()) {
    // The room counts lives, so report and wait. Decrementing here as well
    // would take two off for one wreck as soon as the state comes back.
    netSend(netTopic(), "crashed", { reason });
    state = "crashed";
    return;
  }
  lives--;
  state = lives <= 0 ? "gameOver" : "crashed";
}

// ── Explosion overlay ───────────────────────────────────────
// The taxi itself needs no hiding: draw() only paints it in "playing" and
// "levelComplete", and a crash leaves neither state standing.
function showExplosion(worldX, worldY) {
  if (!explosionEl) return;
  // World -> viewport -> CSS pixels. The CSS negative margin turns this centre
  // point into the box corner, so the blast sits on the taxi and not beside it.
  explosionEl.style.left = ((worldX - camera.x) * viewScale) + "px";
  explosionEl.style.top  = ((worldY - camera.y) * viewScale) + "px";
  // A CSS animation only runs on the transition into the class. Dropping it and
  // reading offsetWidth forces the reflow that lets the next crash replay it.
  explosionEl.classList.remove("explosion--active");
  void explosionEl.offsetWidth;
  explosionEl.classList.add("explosion--active");
}

function hideExplosion() {
  if (!explosionEl) return;
  explosionEl.classList.remove("explosion--active");
}

function crash(reason = "CRASHED!") {
  spawnExplosion(taxi.x + taxi.w/2, taxi.y + taxi.h/2);
  showExplosion(taxi.x + taxi.w/2, taxi.y + taxi.h/2);
  if (!sndExplosion()) sndCrash();
  haptic(HAPTICS.crash);
  loseLife(reason);
}

// Refuelling with a fare aboard. No wreck and no explosion — the taxi is fine,
// the passenger is not, so it gets its own sound rather than the crash noise.
function refuelViolation() {
  sndSad();
  haptic(HAPTICS.penalty);
  loseLife("NO REFUELLING WITH A FARE!");
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.03;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function updateMessages() {
  for (let i = messages.length - 1; i >= 0; i--) {
    messages[i].y -= 0.3;
    messages[i].life--;
    if (messages[i].life <= 0) messages.splice(i, 1);
  }
}

// ── Camera ──────────────────────────────────────────────────
// Presentation only: driven from gameLoop, never from update(), and no
// simulation value may depend on it.
//
// The dead zone matters for feel, not for looks. A camera that rigidly centres
// the taxi keeps the world moving while the player is trying to hold still for
// a landing, which makes the core mechanic harder. Inside the dead zone the
// view stays put.
const CAM_DEAD_W = 240;
const CAM_DEAD_H = 160;
const camera = { x: 0, y: 0 };

function clampCamera() {
  camera.x = Math.max(0, Math.min(camera.x, Math.max(0, worldW - VIEW_W)));
  camera.y = Math.max(0, Math.min(camera.y, Math.max(0, worldH - VIEW_H)));
}

function centerCameraOnTaxi() {
  if (!taxi) { camera.x = 0; camera.y = 0; return; }
  camera.x = taxi.x + taxi.w/2 - VIEW_W/2;
  camera.y = taxi.y + taxi.h/2 - VIEW_H/2;
  clampCamera();
}

function updateCamera() {
  if (!taxi) return;
  const cx = taxi.x + taxi.w/2;
  const cy = taxi.y + taxi.h/2;
  const left   = camera.x + (VIEW_W - CAM_DEAD_W) / 2;
  const right  = left + CAM_DEAD_W;
  const top    = camera.y + (VIEW_H - CAM_DEAD_H) / 2;
  const bottom = top + CAM_DEAD_H;

  if (cx < left)   camera.x -= left - cx;
  if (cx > right)  camera.x += cx - right;
  if (cy < top)    camera.y -= top - cy;
  if (cy > bottom) camera.y += cy - bottom;

  clampCamera();
}

// ── Draw ────────────────────────────────────────────────────
function draw() {
  // Background fills the viewport, in screen space
  ctx.fillStyle = C.black;
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);

  if (state === "menu") {
    drawMenu();
    return;
  }
  if (state === "lobby") {
    drawLobby();
    return;
  }
  if (state === "title") {
    drawTitle();
    return;
  }
  if (state === "gameOver") {
    drawGameOver();
    return;
  }
  if (state === "win") {
    drawWin();
    return;
  }

  // Everything from here to the matching restore is in world coordinates
  ctx.save();
  ctx.translate(-camera.x, -camera.y);
  drawStars();

  const lvl = LEVELS[level];

  // Obstacles
  for (const obs of obstacles) {
    ctx.fillStyle = C.grey;
    ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
    ctx.strokeStyle = C.lightGrey;
    ctx.lineWidth = 1;
    ctx.strokeRect(obs.x, obs.y, obs.w, obs.h);
  }

  // Fuel stations — turn red and read NO FUEL while a fare is aboard, so the
  // rule is visible before it is punished
  if (lvl.fuelStations) {
    const barred = taxi.hasPassenger;
    for (const fs of lvl.fuelStations) {
      ctx.fillStyle = barred ? C.red : C.orange;
      ctx.fillRect(fs.x, fs.y, fs.w, 6);
      ctx.fillStyle = barred ? C.lightRed : C.hotOrange;
      ctx.fillRect(fs.x + 2, fs.y + 1, fs.w - 4, 3);
      ctx.font = "7px 'Press Start 2P'";
      ctx.fillStyle = barred ? C.lightRed : C.hotOrange;
      ctx.textAlign = "center";
      ctx.fillText(barred ? "NO FUEL" : "FUEL", fs.x + fs.w/2, fs.y - 4);
    }
  }

  // Pads. The marker shows the destination while carrying a fare and the pickup
  // pad while empty — without the latter, the empty legs of a random route would
  // be blind searching.
  const activeFare = passengers.find(p => p.phase === "waiting" || p.phase === "boarding");
  for (let i = 0; i < pads.length; i++) {
    const pad = pads[i];
    // Platform base
    ctx.fillStyle = pad.color;
    ctx.fillRect(pad.x, pad.y, pad.w, 6);
    // Striped top
    ctx.fillStyle = C.black;
    for (let sx = pad.x + 2; sx < pad.x + pad.w; sx += 8) {
      ctx.fillRect(sx, pad.y, 4, 2);
    }
    // Legs
    ctx.fillStyle = pad.color;
    ctx.fillRect(pad.x + 4, pad.y + 6, 3, 10);
    ctx.fillRect(pad.x + pad.w - 7, pad.y + 6, 3, 10);
    // Label
    ctx.font = "9px 'Press Start 2P'";
    ctx.fillStyle = pad.color;
    ctx.textAlign = "center";
    ctx.fillText("PAD " + pad.label, pad.x + pad.w/2, pad.y + 26);

    const isDest   = taxi.hasPassenger && taxi.passengerDest === i;
    const isPickup = !taxi.hasPassenger && activeFare && activeFare.padIndex === i;
    if (isDest || isPickup) {
      const blink = Math.sin(levelTimer * 0.15) > 0;
      if (blink) {
        ctx.fillStyle = isDest ? C.hotYellow : C.padGreen;
        ctx.fillText("▼", pad.x + pad.w/2, pad.y - 12);
      }
    }
  }

  // Waiting / boarding passenger (little person sprite)
  for (const p of passengers) {
    if (p.phase === "waiting" || p.phase === "boarding") {
      const pad = pads[p.padIndex];
      drawPerson(p.x, pad.y - 2, C.hotYellow, p.phase === "boarding");
    }
  }

  // Other players, under the local taxi: when two overlap, the one being
  // steered has to stay the readable one.
  drawRemotes();

  // Taxi
  if (state === "playing" || state === "levelComplete") {
    drawTaxi();
  }

  // Particles
  for (const p of particles) {
    const alpha = p.life / p.maxLife;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - 1, p.y - 1, 3, 3);
  }
  ctx.globalAlpha = 1;

  // Messages
  for (const m of messages) {
    const alpha = Math.min(1, m.life / 20);
    ctx.globalAlpha = alpha;
    ctx.font = "10px 'Press Start 2P'";
    ctx.fillStyle = m.color;
    ctx.textAlign = "center";
    ctx.fillText(m.text, m.x, m.y);
  }
  ctx.globalAlpha = 1;

  ctx.restore();   // back to screen space for HUD and overlays

  drawEdgeMarkers();
  drawRemoteMarkers();

  // HUD
  drawHUD();

  // State overlays
  if (state === "crashed") {
    drawOverlay(crashReason, actionHint("RETRY"), C.red);
  }
  if (state === "levelComplete") {
    drawOverlay("LEVEL COMPLETE!", actionHint("CONTINUE"), C.padGreen);
  }
}

// Who is where. Only the top few: at ten players a full list would cover the
// world the player is trying to fly through.
const STANDINGS_SHOWN = 4;

function drawStandings() {
  const players = (roomState && roomState.players) || {};
  const ranked = Object.keys(players)
    .map(id => ({ id, ...players[id] }))
    .sort((a, b) => b.score - a.score);

  ctx.font = "7px 'Press Start 2P'";
  ctx.textAlign = "left";
  let y = 36;
  for (const p of ranked.slice(0, STANDINGS_SHOWN)) {
    const mine = p.id === myPlayerId;
    ctx.fillStyle = mine ? C.hotYellow : (p.alive ? remoteColor(p.id) : C.darkGrey);
    ctx.fillText(`${p.name} ${p.score}` + (p.alive ? "" : " OUT"), 10, y);
    y += 11;
  }
  if (ranked.length > STANDINGS_SHOWN) {
    ctx.fillStyle = C.lightGrey;
    ctx.fillText(`+${ranked.length - STANDINGS_SHOWN} MORE`, 10, y);
  }
}

// Other players' taxis. Deliberately not the same sprite: in a crowd the one
// you are steering has to be findable at a glance, so these are flatter, in a
// colour of their own, and carry a name.
const REMOTE_COLORS = [C.hotOrange, C.padGreen, C.skyBlue, C.lightBlue,
                       C.lightGreen, C.cyan, C.lightRed, C.purple];

function remoteColor(id) {
  let h = 0;
  for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) | 0;
  return REMOTE_COLORS[Math.abs(h) % REMOTE_COLORS.length];
}

// Where the others are when they are not on screen. The world is four times the
// viewport at two players and nine at ten, so a rival is off the edge most of
// the time — and without this the standings say four players while the screen
// shows one, which reads as a fault rather than as distance.
//
// Screen space, so it belongs after the camera transform is popped.
function drawRemoteMarkers() {
  if (!remotes.size) return;
  const players = (roomState && roomState.players) || {};

  for (const r of remotes.values()) {
    if (!r.seen) continue;
    const info = players[r.id];
    if (info && info.alive === false) continue;   // out of the round, not away

    const m = edgeMarkerFor(r.x + r.w/2, r.y + r.h/2);
    if (!m) continue;                             // on screen, already drawn

    ctx.save();
    ctx.translate(m.x, m.y);
    ctx.rotate(m.angle);
    ctx.fillStyle = remoteColor(r.id);
    // Smaller than the pad arrows, and hollowed by a notch, so a rival is never
    // mistaken for somewhere to fly to.
    ctx.beginPath();
    ctx.moveTo(7, 0);
    ctx.lineTo(-4, -5);
    ctx.lineTo(-1, 0);
    ctx.lineTo(-4, 5);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
}

function drawRemotes() {
  if (!remotes.size) return;
  const players = (roomState && roomState.players) || {};

  for (const r of remotes.values()) {
    if (!r.seen) continue;                      // never heard a position yet
    const info = players[r.id];
    if (info && info.alive === false) continue; // out of the round

    const color = remoteColor(r.id);

    ctx.fillStyle = color;
    ctx.fillRect(r.x + 2, r.y + 4, r.w - 4, r.h - 6);
    ctx.fillStyle = C.black;
    ctx.fillRect(r.x + 2, r.y + 10, r.w - 4, 2);
    ctx.fillStyle = C.skyBlue;
    ctx.fillRect(r.x + 8, r.y, 16, 6);

    // Gear, so a landing looks like one from across the map
    if (r.gear > 0.05) {
      ctx.fillStyle = C.lightGrey;
      const drop = GEAR_LEN * r.gear;
      ctx.fillRect(r.x + 5, r.y + r.h, 3, drop);
      ctx.fillRect(r.x + r.w - 8, r.y + r.h, 3, drop);
    }

    if (r.thrust) {
      ctx.fillStyle = C.hotOrange;
      ctx.fillRect(r.x + r.w/2 - 3, r.y + r.h, 6, 5);
    }

    if (info && info.name) {
      ctx.font = "6px 'Press Start 2P'";
      ctx.fillStyle = color;
      ctx.textAlign = "center";
      ctx.fillText(info.name, r.x + r.w/2, r.y - 6);
    }
  }
}

function drawTaxi() {
  const tx = taxi.x, ty = taxi.y, tw = taxi.w, th = taxi.h;

  // Body
  ctx.fillStyle = C.hotYellow;
  ctx.fillRect(tx + 2, ty + 4, tw - 4, th - 6);

  // Cockpit dome
  ctx.fillStyle = C.skyBlue;
  ctx.fillRect(tx + 8, ty, 16, 6);

  // Windows
  ctx.fillStyle = C.cyan;
  ctx.fillRect(tx + 4, ty + 6, 5, 4);
  ctx.fillRect(tx + tw - 9, ty + 6, 5, 4);

  // Stripe
  ctx.fillStyle = C.black;
  ctx.fillRect(tx + 2, ty + 10, tw - 4, 2);

  // "TAXI" sign on top
  ctx.fillStyle = C.white;
  ctx.font = "5px 'Press Start 2P'";
  ctx.textAlign = "center";
  ctx.fillText("TAXI", tx + tw/2, ty + 3);

  // Landing gear — housings always visible, struts extend as taxi.gear grows
  ctx.fillStyle = C.lightGrey;
  ctx.fillRect(tx + 4, ty + th - 2, 6, 2);
  ctx.fillRect(tx + tw - 10, ty + th - 2, 6, 2);
  if (taxi.gear > 0.02) {
    const legLen = GEAR_LEN * taxi.gear;
    ctx.fillStyle = taxi.gear >= 1 ? C.lightGrey : C.grey;
    ctx.fillRect(tx + 6, ty + th, 2, legLen);
    ctx.fillRect(tx + tw - 8, ty + th, 2, legLen);
    // Feet
    ctx.fillRect(tx + 3, ty + th + legLen, 8, 2);
    ctx.fillRect(tx + tw - 11, ty + th + legLen, 8, 2);
  }

  // Show passenger indicator
  if (taxi.hasPassenger) {
    ctx.fillStyle = C.padGreen;
    ctx.fillRect(tx + tw/2 - 2, ty - 4, 4, 4);
  }

  // Thrust flames
  if (taxi.thrustUp && taxi.fuel > 0 && !taxi.landed) {
    const fh = 4 + Math.random() * 6;
    ctx.fillStyle = C.hotOrange;
    ctx.fillRect(tx + tw/2 - 4, ty + th, 8, fh);
    ctx.fillStyle = C.hotYellow;
    ctx.fillRect(tx + tw/2 - 2, ty + th, 4, fh - 2);
  }
  // Thrusting left fires the starboard jet, so the flame sits on the right
  if (taxi.thrustLeft && taxi.fuel > 0 && !taxi.landed) {
    const fw = 3 + Math.random() * 4;
    ctx.fillStyle = C.hotOrange;
    ctx.fillRect(tx + tw, ty + th/2 - 2, fw, 4);
  }
  if (taxi.thrustRight && taxi.fuel > 0 && !taxi.landed) {
    const fw = 3 + Math.random() * 4;
    ctx.fillStyle = C.hotOrange;
    ctx.fillRect(tx - fw, ty + th/2 - 2, fw, 4);
  }
}

function drawPerson(x, y, color, walking = false) {
  const step = Math.sin(levelTimer * (walking ? 0.35 : 0.1)) > 0;
  // Head
  ctx.fillStyle = color;
  ctx.fillRect(x - 2, y - 12, 5, 5);
  // Body
  ctx.fillRect(x - 2, y - 7, 5, 6);
  // Legs — striding while walking, planted while waiting
  if (walking) {
    ctx.fillRect(x - (step ? 5 : 2), y - 1, 3, 3);
    ctx.fillRect(x + (step ? 2 : 0), y - 1, 3, 3);
  } else {
    ctx.fillRect(x - 3, y - 1, 3, 3);
    ctx.fillRect(x + 1, y - 1, 3, 3);
  }
  // Arms — waving for a taxi, swinging while walking
  if (walking) {
    ctx.fillRect(x - 5, y - (step ? 8 : 6), 3, 2);
    ctx.fillRect(x + 4, y - (step ? 6 : 8), 3, 2);
  } else if (step) {
    ctx.fillRect(x - 5, y - 10, 3, 2);
    ctx.fillRect(x + 4, y - 7, 3, 2);
  } else {
    ctx.fillRect(x - 5, y - 7, 3, 2);
    ctx.fillRect(x + 4, y - 10, 3, 2);
  }
}

// Density stays constant as the world grows, so a big world is not an empty one.
// Purely decorative, so plain Math.random() is correct here - see the
// determinism note on the seeded rng above.
const STARS_PER_SECTOR = 80;
let starField = [];

function buildStarField() {
  const sectors = (worldW / SECTOR_W) * (worldH / SECTOR_H);
  const count = Math.round(STARS_PER_SECTOR * sectors);
  starField = [];
  for (let i = 0; i < count; i++) {
    starField.push({
      x: Math.random() * worldW,
      y: Math.random() * worldH,
      s: Math.random() * 2 + 0.5,
      b: Math.random(),
    });
  }
}
buildStarField();

function drawStars() {
  // A big world holds hundreds of stars; only those inside the view are drawn.
  const x0 = camera.x - 2, x1 = camera.x + VIEW_W + 2;
  const y0 = camera.y - 2, y1 = camera.y + VIEW_H + 2;
  ctx.fillStyle = C.white;
  for (const s of starField) {
    if (s.x < x0 || s.x > x1 || s.y < y0 || s.y > y1) continue;
    const flicker = 0.6 + 0.4 * Math.sin(levelTimer * 0.02 + s.b * 10);
    ctx.globalAlpha = flicker * 0.6;
    ctx.fillRect(s.x, s.y, s.s, s.s);
  }
  ctx.globalAlpha = 1;
}

// ── Off-screen target markers ───────────────────────────────
// The pad's own blinking arrow is invisible once the pad leaves the view, which
// would make the empty legs of a random route a blind search. These markers sit
// on the viewport edge and point at the target. Screen space, so they must be
// drawn after the camera transform is popped.
const EDGE_MARGIN = 18;

function edgeMarkerFor(worldX, worldY) {
  const sx = worldX - camera.x;
  const sy = worldY - camera.y;
  if (sx >= 0 && sx <= VIEW_W && sy >= 0 && sy <= VIEW_H) return null;
  return {
    x: Math.max(EDGE_MARGIN, Math.min(sx, VIEW_W - EDGE_MARGIN)),
    y: Math.max(EDGE_MARGIN, Math.min(sy, VIEW_H - EDGE_MARGIN)),
    angle: Math.atan2(sy - VIEW_H/2, sx - VIEW_W/2),
  };
}

function drawEdgeMarker(pad, color) {
  const m = edgeMarkerFor(pad.x + pad.w/2, pad.y);
  if (!m) return;
  ctx.save();
  ctx.translate(m.x, m.y);
  ctx.rotate(m.angle);
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(10, 0);
  ctx.lineTo(-6, -7);
  ctx.lineTo(-6, 7);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawEdgeMarkers() {
  if (!pads || !pads.length || !taxi) return;
  const blink = Math.sin(levelTimer * 0.15) > 0;
  if (!blink) return;
  if (taxi.hasPassenger) {
    if (pads[taxi.passengerDest]) drawEdgeMarker(pads[taxi.passengerDest], C.hotYellow);
    return;
  }
  const fare = passengers.find(p => p.phase === "waiting" || p.phase === "boarding");
  if (fare && pads[fare.padIndex]) drawEdgeMarker(pads[fare.padIndex], C.padGreen);
}

function drawHUD() {
  const barY = 4, barH = 10;

  // Score
  ctx.font = "10px 'Press Start 2P'";
  ctx.fillStyle = C.skyBlue;
  ctx.textAlign = "left";
  ctx.fillText("SCORE: " + score, 10, 18);

  // Level
  ctx.textAlign = "center";
  ctx.fillText("LEVEL " + (level + 1), VIEW_W/2, 18);

  // Lives
  ctx.textAlign = "right";
  ctx.fillText("LIVES: " + lives, VIEW_W - 120, 18);

  // Fuel bar
  ctx.fillStyle = C.darkGrey;
  ctx.fillRect(VIEW_W - 110, barY + 2, 102, barH);
  const fuelPct = taxi.fuel / taxi.maxFuel;
  const fuelColor = fuelPct > 0.3 ? C.padGreen : (fuelPct > 0.1 ? C.hotOrange : C.red);
  ctx.fillStyle = fuelColor;
  ctx.fillRect(VIEW_W - 109, barY + 3, fuelPct * 100, barH - 2);
  ctx.font = "7px 'Press Start 2P'";
  ctx.fillStyle = C.white;
  ctx.textAlign = "center";
  ctx.fillText("FUEL", VIEW_W - 58, barY + barH);

  // Passenger indicator. Online the board is refilled forever, so a count out
  // of a total would be meaningless — the standings replace it.
  if (netActive()) {
    drawStandings();
  } else {
    const delivered = passengers ? passengers.filter(p => p.phase === "delivered").length : 0;
    const total = passengers ? passengers.length : 0;
    ctx.font = "8px 'Press Start 2P'";
    ctx.fillStyle = C.hotYellow;
    ctx.textAlign = "left";
    ctx.fillText("FARES: " + delivered + "/" + total, 10, 36);
  }

  // Speed indicator
  if (taxi) {
    const speed = Math.sqrt(taxi.vx*taxi.vx + taxi.vy*taxi.vy);
    const speedColor = speed > 1.5 ? C.red : (speed > 1.0 ? C.hotOrange : C.padGreen);
    ctx.fillStyle = speedColor;
    ctx.textAlign = "right";
    ctx.fillText("SPD: " + speed.toFixed(1), VIEW_W - 10, 36);

    // Gear indicator — landing is only allowed once this reads DOWN
    ctx.textAlign = "center";
    ctx.fillStyle = taxi.gear >= 1 ? C.padGreen : (taxi.gear > 0 ? C.hotOrange : C.darkGrey);
    ctx.fillText("GEAR " + (taxi.gear >= 1 ? "DOWN" : "UP"), VIEW_W/2, 36);
  }
}

function drawOverlay(title, subtitle, color) {
  ctx.fillStyle = "rgba(0,0,0,0.6)";

  ctx.font = "20px 'Press Start 2P'";
  ctx.fillStyle = color;
  ctx.textAlign = "center";
  ctx.fillText(title, VIEW_W/2, VIEW_H/2 - 10);

  ctx.font = "10px 'Press Start 2P'";
  ctx.fillStyle = C.white;
  ctx.fillText(subtitle, VIEW_W/2, VIEW_H/2 + 20);
}

  ctx.fillStyle = C.cyan;

    ctx.font = "10px 'Press Start 2P'";
    ctx.fillStyle = C.hotYellow;
    ctx.fillText(actionHint("PLAY AGAIN"), VIEW_W/2, VIEW_H/2 + 70);
  }
}

function drawWin() {
  drawStars();
  ctx.font = "22px 'Press Start 2P'";
  ctx.fillStyle = C.padGreen;
  ctx.textAlign = "center";
  ctx.fillText("CONGRATULATIONS!", VIEW_W/2, VIEW_H/2 - 50);

  ctx.font = "12px 'Press Start 2P'";
  ctx.fillStyle = C.hotYellow;
  ctx.fillText("ALL LEVELS COMPLETE!", VIEW_W/2, VIEW_H/2 - 15);

  ctx.fillStyle = C.white;
  ctx.fillText("FINAL SCORE: " + score, VIEW_W/2, VIEW_H/2 + 15);
  ctx.fillText("FARES DELIVERED: " + totalPassengersDelivered, VIEW_W/2, VIEW_H/2 + 40);

  const blink = Math.sin(Date.now() * 0.005) > 0;
  if (blink) {
    ctx.font = "10px 'Press Start 2P'";
    ctx.fillStyle = C.hotYellow;
    ctx.fillText(actionHint("PLAY AGAIN"), VIEW_W/2, VIEW_H/2 + 80);
  }
}

// ── Main Loop ───────────────────────────────────────────────
// Fixed timestep: the simulation always advances in 1/60s slices, so every
// existing physics constant and every `levelTimer % n` counter keeps its
// original meaning regardless of whether the display runs at 60 or 120 Hz.
const STEP = 1000 / 60;
const MAX_STEPS = 5;
let accumulator = 0;
let lastFrame = performance.now();

function applyPauseState() {
  const next = shouldPause();
  if (next === paused) return;
  paused = next;
  if (paused) {
    resetInput();           // otherwise a held thrust stays stuck on return
    setThrustSound(false, false);
    stopRumble();
    setAudioSuspended(true);
  } else {
    accumulator = 0;        // don't replay the time spent in the background
    lastFrame = performance.now();
    setAudioSuspended(false);
  }
}

function gameLoop(now) {
  requestAnimationFrame(gameLoop);
  applyPauseState();

  const elapsed = now - lastFrame;
  lastFrame = now;

  if (!paused) {
    accumulator += Math.min(elapsed, STEP * MAX_STEPS);
    let steps = 0;
    while (accumulator >= STEP && steps++ < MAX_STEPS) {
      input.up    = kbHeld.up    || touchHeld.up;
      input.down  = kbHeld.down  || touchHeld.down;
      input.left  = kbHeld.left  || touchHeld.left;
      input.right = kbHeld.right || touchHeld.right;
      handleInput();
      update();
      accumulator -= STEP;
    }
  }

  // Engine sound and rumble are driven once per frame from the live taxi
  // state, so they stay correct in every game state - including crashed,
  // paused and the title screen, where update() never runs.
  const flying = !paused && state === "playing" && taxi && !taxi.landed && taxi.fuel > 0;
  setThrustSound(flying && taxi.thrustUp,
                 flying && (taxi.thrustLeft || taxi.thrustRight));
  setThrustHaptics(flying && taxi.thrustUp);

  // Outside the simulation step on purpose: both have to keep running in the
  // states where update() does not.
  netFrame();
  updateRemotes();
  updateCamera();
  draw();
}

// The cursor moves on the edge of a steering input, never while it is held —
// the same two buttons fly the taxi, and a held stick would race the cursor.
function handleMenuInput() {
  // Either pair of arrows. The list is drawn top to bottom, so down/up is the
  // more natural reading, but left/right are the two buttons that exist on a
  // touch device — so both steer it and neither is the odd one out.
  const dir = (input.right || input.down) ? 1
            : ((input.left || input.up) ? -1 : 0);
  if (dir === 0) menuNavLatched = false;
  else if (!menuNavLatched) {
    menuNavLatched = true;
    menuIndex = Math.max(0, Math.min(MENU_ENTRIES.length - 1, menuIndex + dir));
    menuNotice = "";
    beep(660, 0.04, "square", 0.05);
  }

  if (!input.action) return;
  input.action = false;
  unlockAudio();
  gameMode = menuIndex === 0 ? "single" : "multi";
  if (gameMode === "single") {
    state = "title";
    menuNotice = "";
  } else {
    menuNotice = "";
    state = "lobby";
    netConnect(defaultRoom());
  }
}

// One shared room unless ?room= says otherwise. A room picker would need text
// entry, which this game has no way to offer on a touch device.
function defaultRoom() {
  try {
    const r = new URLSearchParams(location.search).get("room");
    if (r && /^[a-zA-Z0-9_-]{1,32}$/.test(r)) return r;
  } catch (e) {}
  return "lobby";
}

function handleLobbyInput() {
  if (!input.action) return;
  input.action = false;
  // Nothing to do here but go back: retrying is choosing multiplayer again.
  netDisconnect();
  bootGame();
}

function startOnlineRun() {
  level = roomState && typeof roomState.level === "number" ? roomState.level : 0;
  score = 0;
  lives = 3;                 // replaced by the server's number on the next state
  totalPassengersDelivered = 0;
  pendingClaims.clear();
  collideCooldown.clear();
  newRunSeed();
  initLevel();               // sets state = "playing"
  applyServerPlayers();
}

function startRun() {
  level = 0;
  score = 0;
  lives = 3;
  totalPassengersDelivered = 0;
  // A forced ?seed= replays the same run every time; otherwise roll a new one
  if (forcedSeed !== null) { runSeed = forcedSeed; initCount = 0; }
  else newRunSeed();
  initLevel();
}

// Boot and "back to square one" are the same thing, so they are one function
function bootGame() {
  gameMode = "single";
  menuIndex = 0;
  menuNavLatched = false;
  menuNotice = "";
  state = "menu";
  hideExplosion();
}

function handleInput() {
  if (state === "menu")  { handleMenuInput();  return; }
  if (state === "lobby") { handleLobbyInput(); return; }

  if (input.action) {
    input.action = false;
    unlockAudio();
    if (state === "gameOver" || state === "win") {
      // Back to the menu rather than straight into a new run: without it there
      // is no way back to the mode choice short of reloading the page.
      bootGame();
    } else if (state === "title") {
      startRun();
    } else if (state === "crashed") {
      initLevel();
    } else if (state === "levelComplete") {
      level++;
      if (level >= LEVELS.length) {
        state = "win";
      } else {
        initLevel();
      }
    }
  }
}

// Start
if (forcedSeed !== null) { runSeed = forcedSeed; initCount = 0; }
else newRunSeed();
totalPassengersDelivered = 0;
levelTimer = 0;
particles = [];
messages = [];
taxi = createTaxi();
passengers = [];
pads = [];
obstacles = [];
bootGame();

document.addEventListener("visibilitychange", applyPauseState);
window.addEventListener("blur",  () => { windowBlurred = true;  applyPauseState(); });
window.addEventListener("focus", () => { windowBlurred = false; applyPauseState(); });

layoutCanvas();
registerServiceWorker();
requestAnimationFrame(gameLoop);

})();
</script>
</body>
</html>
